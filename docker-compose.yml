services:
  postgres:
    image: postgres:17-alpine
    container_name: clientflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: clientflow
      POSTGRES_PASSWORD: clientflow_dev_password
      POSTGRES_DB: clientflow

    ports:
      - "5432:5432"

    volumes:
      - clientflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U clientflow -d clientflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clientflow_postgres_data: